<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- Primary SEO -->
  <title>Jeyda Daily Supplies Co. Ltd. | Premium Eco-Friendly Care Products</title>
  <meta name="description"
    content="Jeyda Daily Supplies Co. Ltd. is a premium manufacturer and global exporter of eco-friendly laundry detergent, dish cleanser, antibacterial handwash, and shower gel. ISO 9001 certified. OEM/ODM available. Serving 50+ countries." />
  <meta name="keywords"
    content="Jeyda, laundry detergent, dish cleanser, antibacterial handwash, shower gel, eco-friendly cleaning products, OEM ODM manufacturer, private label home care, bulk detergent exporter, global cleaning products supplier" />
  <meta name="author" content="Jeyda Daily Supplies Co. Ltd." />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="theme-color" content="#1e40af" />

  <!-- Canonical -->
  <link rel="canonical" href="https://www.jeyda.co.ke/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Jeyda Daily Supplies Co. Ltd." />
  <meta property="og:url" content="https://www.jeyda.co.ke/" />
  <meta property="og:title" content="Jeyda Daily Supplies Co. Ltd. | Premium Eco-Friendly Care Products" />
  <meta property="og:description"
    content="Premium manufacturer and global exporter of eco-friendly home and personal care products. ISO 9001 certified. OEM/ODM available. Serving 50+ countries worldwide." />
  <meta property="og:image" content="https://www.jeyda.co.ke/hero-2.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Jeyda Daily Supplies — Premium Eco-Friendly Care Products" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Jeyda Daily Supplies Co. Ltd. | Premium Eco-Friendly Care Products" />
  <meta name="twitter:description"
    content="Premium manufacturer and global exporter of eco-friendly home and personal care products. OEM/ODM services available." />
  <meta name="twitter:image" content="https://www.jeyda.co.ke/hero-2.jpg" />
  <meta name="twitter:image:alt" content="Jeyda Daily Supplies — Premium Eco-Friendly Care Products" />

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Jeyda Daily Supplies Co. Ltd.",
      "url": "https://www.jeyda.co.ke",
      "logo": "https://www.jeyda.co.ke/favicon.png",
      "description": "Premium manufacturer and global exporter of eco-friendly home and personal care products including laundry detergent, dish cleanser, antibacterial handwash, and shower gel.",
      "foundingDate": "2013",
      "numberOfEmployees": "100+",
      "areaServed": "Worldwide",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Sales",
        "availableLanguage": ["English", "Chinese"]
      },
      "sameAs": []
    }
    </script>

  <!-- Structured Data: WebSite with SearchAction -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Jeyda Daily Supplies Co. Ltd.",
      "url": "https://www.jeyda.co.ke",
      "description": "Premium eco-friendly home care and personal care products manufacturer and global exporter.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.jeyda.co.ke/products?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
